name: Participant module toolchain
description: Install the Rust toolchain that builds the participant module and fetch its locked dependencies

runs:
    using: composite
    steps:
        - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
          with:
              toolchain: 1.95.0
              targets: wasm32-unknown-unknown
        # The module builds offline from the research workspace's lockfile.
        - shell: bash
          run: cargo +1.95.0 fetch --locked --manifest-path crates/protocol-research/Cargo.toml
