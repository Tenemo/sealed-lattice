name: ci

on:
    push:
        branches:
            - master
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    rust:
        name: rust
        runs-on: ubuntu-latest
        timeout-minutes: 120
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: cargo fmt --check --all
            - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
            - run: pnpm run test:lanes:verify -- --rust
            - run: pnpm run test:rust:process-memory-guard
            - name: Run Rust tests with optimized test profile
              run: pnpm run test:rust:kernel

    rust-heavy:
        name: rust heavy
        runs-on: ubuntu-latest
        timeout-minutes: 120
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - name: Run measured-heavy Rust kernel tests
              id: rust-heavy
              timeout-minutes: 110
              run: pnpm run test:rust:kernel:heavy
            - name: Upload measured-heavy Rust kernel logs
              if: ${{ failure() && steps['rust-heavy'].outcome == 'failure' }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  if-no-files-found: error
                  name: rust-heavy-logs
                  retention-days: 7
                  path: logs

    rust-accepted-setup:
        name: rust accepted setup
        runs-on: ubuntu-latest
        timeout-minutes: 360
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - name: Run Rust accepted setup proof tests
              id: rust-accepted-setup
              timeout-minutes: 350
              run: pnpm run test:rust:kernel:accepted-setup -- --ci
            - name: Upload Rust accepted setup logs
              if: ${{ failure() && steps['rust-accepted-setup'].outcome == 'failure' }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  if-no-files-found: error
                  name: rust-accepted-setup-logs
                  retention-days: 7
                  path: logs

    wasm:
        name: wasm
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: cargo build --workspace --lib --target wasm32-unknown-unknown --release

    verify-static:
        name: verify static
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: |
                  pnpm run build
                  pnpm run lint
                  pnpm run tsc
                  pnpm exec tsx ./tools/ci/generate-api-surface-summary.ts
                  pnpm exec tsx ./tools/ci/verify-public-package-policy.ts
                  pnpm run test:lanes:verify -- --static
                  pnpm exec tsx ./tools/ci/check-package-boundaries.ts
                  pnpm exec knip

    node-fast:
        name: node fast
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm run test:node:fast

    node-protocol:
        name: node protocol
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm run test:node:protocol

    node-kernel-fast:
        name: node kernel fast
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm run test:node:kernel:fast

    node-kernel-heavy:
        name: node kernel heavy
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm run test:node:kernel:heavy

    verify:
        name: verify
        runs-on: ubuntu-latest
        timeout-minutes: 5
        needs:
            - rust
            - rust-heavy
            - rust-accepted-setup
            - wasm
            - verify-static
            - node-fast
            - node-protocol
            - node-kernel-fast
            - node-kernel-heavy
            - browser
            - release-smoke
        if: ${{ always() }}
        steps:
            - name: Check verify jobs
              run: |
                  node --input-type=module <<'NODE'
                  const needs = ${{ toJSON(needs) }};
                  const eventName = ${{ toJSON(github.event_name) }};
                  const failed = Object.entries(needs).filter(
                    ([name, job]) =>
                      job.result !== 'success' &&
                      !(
                        name === 'release-smoke' &&
                        eventName !== 'pull_request' &&
                        job.result === 'skipped'
                      ),
                  );
                  if (failed.length > 0) {
                    console.error(
                      failed
                        .map(([name, job]) => `${name}: ${job.result}`)
                        .join('\n'),
                    );
                    process.exit(1);
                  }
                  console.log('Verify jobs passed.');
                  NODE

    browser:
        name: browser
        runs-on: macos-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm exec playwright install --with-deps chromium firefox webkit
            - run: pnpm run test:browser

    release-smoke:
        name: release smoke
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm run build
            - run: pnpm run smoke:pack:npm
            - run: |
                  PUBLIC_PACKAGE_DIR="$(mktemp -d)"
                  node ./tools/ci/stage-public-package.mjs --out "${PUBLIC_PACKAGE_DIR}"
                  cd "${PUBLIC_PACKAGE_DIR}"
                  npm pack --dry-run --ignore-scripts
