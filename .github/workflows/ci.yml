name: ci

on:
    push:
        branches:
            - master
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    rust:
        name: rust
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: cargo fmt --check -p sealed-lattice-kernel
            - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
            - name: Run Rust tests with optimized test profile
              run: cargo test --workspace

    rust-accepted-setup-fast:
        name: rust accepted setup fast
        runs-on: ubuntu-latest
        timeout-minutes: 360
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - name: Run Rust accepted setup fast proof checks
              id: rust-accepted-setup-fast
              timeout-minutes: 350
              run: pnpm run test:rust:kernel:accepted-setup:fast -- --ci
            - name: Upload Rust accepted setup fast logs
              if: ${{ failure() && steps['rust-accepted-setup-fast'].outcome == 'failure' }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  if-no-files-found: error
                  name: rust-accepted-setup-fast-logs
                  retention-days: 7
                  path: logs

    rust-accepted-setup-final-package:
        name: rust accepted setup final package
        runs-on: ubuntu-latest
        timeout-minutes: 360
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - name: Run Rust accepted setup final package
              id: accepted-setup-final-package
              timeout-minutes: 350
              run: pnpm run test:rust:kernel:accepted-setup:final-package -- --ci
            - name: Upload Rust accepted setup final package logs
              if: ${{ failure() && steps['accepted-setup-final-package'].outcome == 'failure' }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  if-no-files-found: error
                  name: rust-accepted-setup-final-package-logs
                  retention-days: 7
                  path: logs

    wasm:
        name: wasm
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: cargo build --workspace --lib --target wasm32-unknown-unknown --release

    verify-static:
        name: verify static
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: |
                  pnpm run build
                  pnpm run lint
                  pnpm run tsc
                  pnpm exec tsx ./tools/ci/generate-api-surface-summary.ts
                  pnpm exec tsx ./tools/ci/verify-public-package-policy.ts
                  pnpm exec tsx ./tools/ci/verify-test-lane-coverage.ts
                  pnpm exec tsx ./tools/ci/check-package-boundaries.ts
                  pnpm exec knip

    node-fast:
        name: node fast
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm run test:node:fast

    node-protocol:
        name: node protocol
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm run test:node:protocol

    node-kernel-fast:
        name: node kernel fast
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm run test:node:kernel:fast

    node-kernel-heavy:
        name: node kernel heavy
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm run test:node:kernel:heavy

    verify:
        name: verify
        runs-on: ubuntu-latest
        timeout-minutes: 5
        needs:
            - rust
            - rust-accepted-setup-fast
            - rust-accepted-setup-final-package
            - wasm
            - verify-static
            - node-fast
            - node-protocol
            - node-kernel-fast
            - node-kernel-heavy
            - browser
            - release-smoke
        if: ${{ always() }}
        steps:
            - name: Check verify jobs
              run: |
                  node --input-type=module <<'NODE'
                  const needs = ${{ toJSON(needs) }};
                  const failed = Object.entries(needs).filter(
                    ([, job]) => job.result !== 'success',
                  );
                  if (failed.length > 0) {
                    console.error(
                      failed
                        .map(([name, job]) => `${name}: ${job.result}`)
                        .join('\n'),
                    );
                    process.exit(1);
                  }
                  console.log('Verify jobs passed.');
                  NODE

    browser:
        name: browser
        runs-on: macos-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm exec playwright install --with-deps chromium firefox webkit
            - run: pnpm run test:browser

    release-smoke:
        name: release smoke
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm run build
            - run: pnpm run smoke:pack:npm
            - run: |
                  PUBLIC_PACKAGE_DIR="$(mktemp -d)"
                  node ./tools/ci/stage-public-package.mjs --out "${PUBLIC_PACKAGE_DIR}"
                  cd "${PUBLIC_PACKAGE_DIR}"
                  npm pack --dry-run --ignore-scripts
