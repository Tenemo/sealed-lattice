name: ci

on:
    push:
        branches:
            - master
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ format('ci-{0}-{1}', github.workflow, github.ref) }}
    cancel-in-progress: true

jobs:
    routine:
        name: static, Node, and browser
        runs-on: ubuntu-24.04
        timeout-minutes: 135
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  toolchain: 1.90.0
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
            - name: Build workspace packages
              run: pnpm run build
            - name: Verify reproducible build output
              run: pnpm run build:verify-reproducible
            - name: Lint workspace
              run: pnpm run lint
            - name: Type-check workspace
              run: pnpm run tsc
            - name: Scan for unused code
              run: pnpm exec knip
            - name: Run Node tests against the built workspace
              timeout-minutes: 90
              run: pnpm run test:node:built
            - name: Install Chromium
              run: pnpm exec playwright install --with-deps chromium
            - name: Run Chromium tests against the built workspace
              timeout-minutes: 55
              run: pnpm run test:browser:built

    rust-fast:
        name: rust fast
        runs-on: ubuntu-24.04
        timeout-minutes: 135
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  toolchain: 1.90.0
            - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
            - run: cargo fmt --all --check
            - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
            - name: Run Rust kernel tests
              timeout-minutes: 110
              run: pnpm run test:rust:kernel
            - name: Upload Rust diagnostics
              if: ${{ failure() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  if-no-files-found: warn
                  name: rust-fast-logs-${{ github.run_id }}-${{ github.run_attempt }}
                  path: logs

    rust-heavy-placeholder:
        name: rust heavy (disabled placeholder)
        if: ${{ false }}
        runs-on: ubuntu-24.04
        steps:
            - run: echo "No heavy Rust test is active."

    verify:
        name: verify
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        needs:
            - routine
            - rust-fast
            - rust-heavy-placeholder
        if: ${{ always() }}
        steps:
            - name: Refuse failed or unexpected job states
              if: ${{ needs.routine.result != 'success' || needs.rust-fast.result != 'success' || needs.rust-heavy-placeholder.result != 'skipped' }}
              run: exit 1
            - run: echo "Verify jobs passed."
