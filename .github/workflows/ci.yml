name: ci

on:
    push:
        branches:
            - master
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ format('ci-{0}-{1}', github.workflow, github.ref) }}
    cancel-in-progress: true

jobs:
    changes:
        name: changes
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        outputs:
            run_heavy: ${{ steps.classify.outputs.run_heavy }}
            run_routine: ${{ steps.classify.outputs.run_routine }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
              with:
                  node-version-file: .nvmrc
            - name: Classify CI lanes
              id: classify
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  PUSH_BASE_SHA: ${{ github.event.before }}
              run: node ./tools/ci/classify-ci-changes.mjs

    routine:
        name: static, Node, and browser
        needs:
            - changes
        if: ${{ needs.changes.outputs.run_routine == 'true' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 135
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  toolchain: 1.90.0
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
            - name: Build workspace packages
              run: pnpm run build
            - name: Verify reproducible build output
              run: pnpm run build:verify-reproducible
            - name: Lint workspace
              run: pnpm run lint
            - name: Type-check workspace
              run: pnpm run tsc
            - name: Scan for unused code
              run: pnpm exec knip
            - name: Run Node tests against the built workspace
              timeout-minutes: 90
              run: pnpm run test:node:built
            - name: Install browser engines
              run: pnpm exec playwright install --with-deps chromium firefox webkit
            - name: Run browser matrix against the built workspace
              timeout-minutes: 55
              run: pnpm run test:browser:built

    rust-fast:
        name: rust fast
        needs:
            - changes
        if: ${{ needs.changes.outputs.run_routine == 'true' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 135
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  toolchain: 1.90.0
            - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
            - run: cargo fmt --all --check
            - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
            - run: pnpm run test:rust:process-memory-guard
            - name: Run fast Rust kernel tests
              timeout-minutes: 110
              run: pnpm run test:rust:kernel
            - name: Upload Rust fast diagnostics
              if: ${{ failure() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  if-no-files-found: warn
                  name: rust-fast-logs-${{ github.run_id }}-${{ github.run_attempt }}
                  path: logs

    rust-heavy:
        name: rust heavy
        needs:
            - changes
        if: ${{ needs.changes.outputs.run_heavy == 'true' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 130
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  toolchain: 1.90.0
            - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
            - name: Run measured-heavy Rust kernel tests
              timeout-minutes: 110
              run: pnpm run test:rust:kernel:heavy
            - name: Upload measured-heavy Rust kernel logs
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  if-no-files-found: warn
                  name: rust-heavy-logs-${{ github.run_id }}-${{ github.run_attempt }}
                  path: logs

    verify:
        name: verify
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        needs:
            - changes
            - routine
            - rust-fast
            - rust-heavy
        if: ${{ always() }}
        steps:
            - name: Check verify jobs
              env:
                  RUN_HEAVY: ${{ needs.changes.outputs.run_heavy }}
                  RUN_ROUTINE: ${{ needs.changes.outputs.run_routine }}
              run: |
                  node --input-type=module <<'NODE'
                  const needs = ${{ toJSON(needs) }};
                  if (!['true', 'false'].includes(process.env.RUN_HEAVY)) {
                    console.error(`Invalid run_heavy output: ${String(process.env.RUN_HEAVY)}`);
                    process.exit(1);
                  }
                  if (!['true', 'false'].includes(process.env.RUN_ROUTINE)) {
                    console.error(`Invalid run_routine output: ${String(process.env.RUN_ROUTINE)}`);
                    process.exit(1);
                  }
                  const allowedSkippedJobs = new Set();
                  if (process.env.RUN_HEAVY === 'false') {
                    allowedSkippedJobs.add('rust-heavy');
                  }
                  if (process.env.RUN_ROUTINE === 'false') {
                    allowedSkippedJobs.add('routine');
                    allowedSkippedJobs.add('rust-fast');
                  }
                  const failed = Object.entries(needs).filter(
                    ([jobName, job]) =>
                      job.result !== 'success' &&
                      !(
                        job.result === 'skipped' &&
                        allowedSkippedJobs.has(jobName)
                      ),
                  );
                  if (failed.length > 0) {
                    console.error(
                      failed
                        .map(([jobName, job]) => `${jobName}: ${job.result}`)
                        .join('\n'),
                    );
                    process.exit(1);
                  }
                  console.log('Verify jobs passed.');
                  NODE
