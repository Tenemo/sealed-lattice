name: ci

on:
    push:
        branches:
            - master
    pull_request:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    SEALED_LATTICE_TURBO_CACHE: "local:,remote:"

jobs:
    rust:
        name: rust
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: dtolnay/rust-toolchain@1.90.0
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: cargo fmt --check
            - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
            - run: cargo test --workspace

    wasm:
        name: wasm
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: dtolnay/rust-toolchain@1.90.0
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: cargo build --workspace --lib --target wasm32-unknown-unknown --release

    verify:
        name: verify
        runs-on: ubuntu-latest
        timeout-minutes: 35
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@1.90.0
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm run check
            - run: pnpm run test:node:built

    coverage:
        name: coverage
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@1.90.0
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm run coverage:node

    browser:
        name: browser
        runs-on: macos-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@1.90.0
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm exec playwright install --with-deps chromium firefox webkit
            - run: pnpm run build
            - run: pnpm run test:browser:built

    docs:
        name: docs
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@1.90.0
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm run verify:docs

    release-smoke:
        name: release smoke
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v6.0.2
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@1.90.0
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm run build
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm run verify:docs
            - run: pnpm run smoke:pack
            - run: pnpm run smoke:pack:npm
            - run: |
                  PUBLIC_PACKAGE_DIR="$(mktemp -d)"
                  node ./tools/ci/stage-public-package.mjs --out "${PUBLIC_PACKAGE_DIR}"
                  cd "${PUBLIC_PACKAGE_DIR}"
                  npm pack --dry-run --ignore-scripts
