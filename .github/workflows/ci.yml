name: ci

on:
    push:
        branches:
            - master
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ format('ci-{0}-{1}', github.workflow, github.ref) }}
    cancel-in-progress: true

jobs:
    routine:
        name: static, Node, and browser
        runs-on: ubuntu-24.04
        timeout-minutes: 135
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: ./.github/actions/participant-toolchain
            - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
              with:
                  workspaces: crates/protocol-research -> ../../target/participant-module
            - name: Build workspace packages
              run: pnpm run build
            - name: Verify reproducible build output
              run: pnpm run build:verify-reproducible
            - name: Lint workspace
              run: pnpm run lint
            - name: Type-check workspace
              run: pnpm run tsc
            - name: Scan for unused code
              run: pnpm exec knip
            - name: Run Node tests against the built workspace
              timeout-minutes: 90
              run: pnpm run test:node:built
            - name: Install Chromium
              run: pnpm exec playwright install --with-deps chromium
            - name: Run Chromium tests against the built workspace
              timeout-minutes: 55
              run: pnpm run test:browser:built

    rust-fast:
        name: rust fast
        runs-on: ubuntu-24.04
        timeout-minutes: 135
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: ./.github/actions/participant-toolchain
            - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
              with:
                  workspaces: crates/protocol-research
            - run: cargo +1.95.0 fmt --manifest-path crates/protocol-research/Cargo.toml --all -- --check
            - run: cargo +1.95.0 clippy --manifest-path crates/protocol-research/Cargo.toml --offline --locked -p registration-credentials --all-targets -- -D warnings
            - name: Run Rust kernel tests
              timeout-minutes: 110
              run: pnpm run test:rust:kernel
            - name: Upload Rust diagnostics
              if: ${{ failure() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  if-no-files-found: warn
                  name: rust-fast-logs-${{ github.run_id }}-${{ github.run_attempt }}
                  path: logs

    verify:
        name: verify
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        needs:
            - routine
            - rust-fast
        if: ${{ always() }}
        steps:
            - name: Refuse failed or unexpected job states
              if: ${{ needs.routine.result != 'success' || needs.rust-fast.result != 'success' }}
              run: exit 1
            - run: echo "Verify jobs passed."
