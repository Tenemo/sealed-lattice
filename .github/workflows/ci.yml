name: CI

on:
    push:
        branches:
            - master
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ format('ci-{0}-{1}', github.workflow, github.ref) }}
    cancel-in-progress: true

jobs:
    check:
        name: Desktop check
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: ./.github/actions/rust-toolchain
              with:
                  cache-workspaces: |
                      crates/protocol-research -> ../../target/participant-module
                      crates/protocol-research
            - name: Install Chromium
              run: pnpm exec playwright install --with-deps chromium
            # The local check graph with its lane limits, annotations and step
            # summary: build, type check, packed-package smoke test, lint,
            # Rust, unused-code scan, Node tests and Chromium tests.
            - name: Run the desktop check
              run: pnpm run check:desktop
            - name: Verify reproducible build output
              run: pnpm run build:verify-reproducible
            - name: Upload check diagnostics
              if: ${{ failure() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  if-no-files-found: warn
                  name: check-logs-${{ github.run_id }}-${{ github.run_attempt }}
                  path: logs

    verify:
        name: verify
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        needs:
            - check
        if: ${{ always() }}
        steps:
            - name: Refuse failed or unexpected job states
              if: ${{ needs.check.result != 'success' }}
              run: exit 1
            - run: echo "Verify jobs passed."
