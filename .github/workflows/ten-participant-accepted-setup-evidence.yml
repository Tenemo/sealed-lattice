name: ten-participant accepted setup evidence

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ format('ci-ten-participant-accepted-setup-evidence-{0}', github.ref) }}
    cancel-in-progress: false

jobs:
    rust-ten-participant-accepted-setup-evidence:
        name: rust ten-participant accepted setup evidence
        runs-on: ubuntu-24.04
        timeout-minutes: 370
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  toolchain: 1.90.0
            - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
            - name: Run ten-participant proof-bearing accepted-setup evidence
              timeout-minutes: 350
              run: pnpm run test:rust:kernel:accepted-setup:ten-participant-evidence
            - name: Upload ten-participant accepted-setup evidence logs
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  if-no-files-found: warn
                  name: rust-ten-participant-accepted-setup-evidence-logs-${{ github.run_id }}-${{ github.run_attempt }}
                  path: logs
