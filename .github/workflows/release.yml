name: release

run-name: release ${{ inputs.release_type }} from master

on:
    workflow_dispatch:
        inputs:
            release_type:
                description: Version bump to apply
                required: true
                type: choice
                default: patch
                options:
                    - patch
                    - minor
                    - major
                    - beta from patch
                    - beta from minor
                    - beta from major
                    - beta next
                    - promote beta to stable

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    validate-dispatch:
        name: validate dispatch
        runs-on: ubuntu-latest
        timeout-minutes: 5
        defaults:
            run:
                shell: bash
        steps:
            - name: ensure master release
              run: |
                  if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" != "master" ]]; then
                    echo "The GitHub manual-dispatch branch selector cannot be disabled. Select master for releases." >&2
                    exit 1
                  fi

    rust:
        name: rust
        needs:
            - validate-dispatch
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: cargo fmt --check -p sealed-lattice-kernel
            - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
            - run: cargo test --workspace

    rust-kernel-heavy:
        name: rust kernel heavy
        needs:
            - validate-dispatch
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm run test:rust:kernel:heavy -- --no-run-log

    wasm:
        name: wasm
        needs:
            - validate-dispatch
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: cargo build --workspace --lib --target wasm32-unknown-unknown --release

    verify-static:
        name: verify static
        needs:
            - validate-dispatch
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: |
                  pnpm run build
                  pnpm run lint
                  pnpm run tsc
                  pnpm exec tsx ./tools/ci/generate-api-surface-summary.ts
                  pnpm exec tsx ./tools/ci/verify-public-package-policy.ts
                  pnpm exec tsx ./tools/ci/verify-test-lane-coverage.ts
                  pnpm exec tsx ./tools/ci/check-package-boundaries.ts
                  pnpm run vectors
                  pnpm exec knip

    node-fast:
        name: node fast
        needs:
            - validate-dispatch
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm run test:node:fast -- --no-run-log

    node-protocol:
        name: node protocol
        needs:
            - validate-dispatch
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm run test:node:protocol -- --no-run-log

    node-kernel:
        name: node kernel
        needs:
            - validate-dispatch
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm run test:node:kernel -- --no-run-log

    node-kernel-heavy:
        name: node kernel heavy
        needs:
            - validate-dispatch
        runs-on: ubuntu-latest
        timeout-minutes: 90
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm run test:node:kernel:heavy -- --no-run-log

    verify:
        name: verify
        runs-on: ubuntu-latest
        timeout-minutes: 5
        needs:
            - rust
            - rust-kernel-heavy
            - wasm
            - verify-static
            - node-fast
            - node-protocol
            - node-kernel
            - node-kernel-heavy
            - browser
            - docs
            - release-smoke
        if: ${{ always() }}
        steps:
            - name: Check verify jobs
              run: |
                  node --input-type=module <<'NODE'
                  const needs = ${{ toJSON(needs) }};
                  const failed = Object.entries(needs).filter(
                    ([, job]) => job.result !== 'success',
                  );
                  if (failed.length > 0) {
                    console.error(
                      failed
                        .map(([name, job]) => `${name}: ${job.result}`)
                        .join('\n'),
                    );
                    process.exit(1);
                  }
                  console.log('Verify jobs passed.');
                  NODE

    browser:
        name: browser
        needs:
            - validate-dispatch
        runs-on: macos-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm exec playwright install --with-deps chromium firefox webkit
            - run: pnpm run test:browser -- --no-run-log

    docs:
        name: docs
        needs:
            - validate-dispatch
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm run verify:docs

    release-smoke:
        name: release smoke
        needs:
            - validate-dispatch
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330
            - run: pnpm run build
            - run: pnpm run smoke:pack:npm
            - run: |
                  PUBLIC_PACKAGE_DIR="$(mktemp -d)"
                  node ./tools/ci/stage-public-package.mjs --out "${PUBLIC_PACKAGE_DIR}"
                  cd "${PUBLIC_PACKAGE_DIR}"
                  npm pack --dry-run --ignore-scripts

    prepare-release:
        needs:
            - validate-dispatch
            - verify
        runs-on: ubuntu-latest
        timeout-minutes: 35
        outputs:
            source_sha: ${{ steps.source.outputs.sha }}
            version: ${{ steps.metadata.outputs.version }}
            tag: ${{ steps.metadata.outputs.tag }}
            dist_tag: ${{ steps.metadata.outputs.dist_tag }}
            prerelease: ${{ steps.metadata.outputs.prerelease }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  ref: ${{ github.sha }}

            - name: capture source revision
              id: source
              run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  components: clippy, rustfmt
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330

            - name: bump release version
              id: metadata
              run: |
                  CURRENT_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")
                  RELEASE_TYPE="${{ inputs.release_type }}"
                  sync_sdk_version_from_root() {
                    node --input-type=module <<'NODE'
                  import { readFileSync, writeFileSync } from 'node:fs';

                  const rootPackageJson = JSON.parse(readFileSync('package.json', 'utf8'));
                  const sdkPackageJsonPath = 'packages/sdk/package.json';
                  const sdkPackageJson = JSON.parse(readFileSync(sdkPackageJsonPath, 'utf8'));

                  if (typeof rootPackageJson.version !== 'string' || rootPackageJson.version.length === 0) {
                    throw new Error('Root package.json must define the release version.');
                  }

                  if (sdkPackageJson.version !== rootPackageJson.version) {
                    sdkPackageJson.version = rootPackageJson.version;
                    writeFileSync(sdkPackageJsonPath, `${JSON.stringify(sdkPackageJson, null, 4)}\n`, 'utf8');
                  }
                  NODE
                  }

                  sync_sdk_version_from_root

                  case "${RELEASE_TYPE}" in
                    "beta next")
                      if [[ ! "${CURRENT_VERSION}" =~ -beta\.[0-9]+$ ]]; then
                        echo "beta next requires an existing beta version." >&2
                        exit 1
                      fi
                      npm version prerelease --preid beta --no-git-tag-version
                      ;;
                    "promote beta to stable")
                      if [[ ! "${CURRENT_VERSION}" =~ -beta\.[0-9]+$ ]]; then
                        echo "promote beta to stable requires an existing beta version." >&2
                        exit 1
                      fi
                      npm version "${CURRENT_VERSION%%-*}" --no-git-tag-version
                      ;;
                    "beta from patch")
                      npm version prepatch --preid beta --no-git-tag-version
                      ;;
                    "beta from minor")
                      npm version preminor --preid beta --no-git-tag-version
                      ;;
                    "beta from major")
                      npm version premajor --preid beta --no-git-tag-version
                      ;;
                    "patch" | "minor" | "major")
                      npm version "${RELEASE_TYPE}" --no-git-tag-version
                      ;;
                    *)
                      echo "Unsupported release type: ${RELEASE_TYPE}" >&2
                      exit 1
                      ;;
                  esac

                  sync_sdk_version_from_root

                  VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")
                  SDK_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/sdk/package.json', 'utf8')).version)")

                  if [[ "${VERSION}" == "${CURRENT_VERSION}" ]]; then
                    echo "Release version did not change." >&2
                    exit 1
                  fi

                  if [[ "${SDK_VERSION}" != "${VERSION}" ]]; then
                    echo "SDK package metadata version mismatch after sync: expected ${VERSION}, received ${SDK_VERSION}." >&2
                    exit 1
                  fi

                  if [[ "${VERSION}" == *-* ]]; then
                    DIST_TAG="${VERSION#*-}"
                    DIST_TAG="${DIST_TAG%%.*}"
                    PRERELEASE=true
                  else
                    DIST_TAG=latest
                    PRERELEASE=false
                  fi

                  echo "previous_version=${CURRENT_VERSION}" >> "${GITHUB_OUTPUT}"
                  echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
                  echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
                  echo "dist_tag=${DIST_TAG}" >> "${GITHUB_OUTPUT}"
                  echo "prerelease=${PRERELEASE}" >> "${GITHUB_OUTPUT}"

            - run: pnpm run build
            - run: pnpm run smoke:pack:npm
            - run: |
                  PUBLIC_PACKAGE_DIR="$(mktemp -d)"
                  node ./tools/ci/stage-public-package.mjs --out "${PUBLIC_PACKAGE_DIR}"
                  cd "${PUBLIC_PACKAGE_DIR}"
                  npm publish --dry-run --ignore-scripts

            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  if-no-files-found: error
                  name: release-package
                  retention-days: 1
                  path: |
                      package.json
                      pnpm-lock.yaml
                      packages/sdk/package.json
                      packages/sdk/dist

    push-release:
        needs:
            - prepare-release
        runs-on: ubuntu-latest
        timeout-minutes: 20
        defaults:
            run:
                shell: bash
        steps:
            - name: verify release deploy key secret
              env:
                  RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
              run: |
                  if [[ -z "${RELEASE_DEPLOY_KEY}" ]]; then
                    echo "Missing RELEASE_DEPLOY_KEY repository secret." >&2
                    exit 1
                  fi

            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0
                  persist-credentials: true
                  ref: ${{ needs.prepare-release.outputs.source_sha }}
                  ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

            - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
              with:
                  node-version-file: .nvmrc

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: release-package
                  path: .

            - name: verify downloaded release artifact
              run: |
                  EXPECTED_VERSION="${{ needs.prepare-release.outputs.version }}"
                  ROOT_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")
                  ACTUAL_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/sdk/package.json', 'utf8')).version)")

                  if [[ "${ROOT_VERSION}" != "${EXPECTED_VERSION}" ]]; then
                    echo "Root package metadata version mismatch: expected ${EXPECTED_VERSION}, received ${ROOT_VERSION}." >&2
                    exit 1
                  fi

                  if [[ "${ACTUAL_VERSION}" != "${EXPECTED_VERSION}" ]]; then
                    echo "Downloaded release package metadata version mismatch: expected ${EXPECTED_VERSION}, received ${ACTUAL_VERSION}." >&2
                    exit 1
                  fi

                  if [[ ! -f packages/sdk/dist/index.js ]]; then
                    echo "Downloaded release artifact is missing packages/sdk/dist/index.js." >&2
                    exit 1
                  fi

            - name: commit release metadata
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git add package.json packages/sdk/package.json pnpm-lock.yaml

                  if git diff --cached --quiet; then
                    echo "No release metadata changes were staged." >&2
                    exit 1
                  fi

                  git commit -m "chore(release): ${{ needs.prepare-release.outputs.tag }}"
                  git tag -a "${{ needs.prepare-release.outputs.tag }}" -m "Release ${{ needs.prepare-release.outputs.tag }}"

            - name: verify remote release target
              run: |
                  git fetch origin master --tags

                  if [[ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/master)" ]]; then
                    echo "origin/master moved during the release run. Start a new release from the updated master." >&2
                    exit 1
                  fi

                  if git ls-remote --exit-code --tags origin "${{ needs.prepare-release.outputs.tag }}" >/dev/null 2>&1; then
                    echo "Tag ${{ needs.prepare-release.outputs.tag }} already exists on origin." >&2
                    exit 1
                  fi

            - name: verify npm release target
              run: |
                  if npm view "sealed-lattice@${{ needs.prepare-release.outputs.version }}" version >/dev/null 2>&1; then
                    echo "Version ${{ needs.prepare-release.outputs.version }} already exists on npm." >&2
                    exit 1
                  fi

            - name: push release commit and tag
              run: |
                  git remote set-url origin "git@github.com:${{ github.repository }}.git"
                  git push --atomic origin HEAD:master "refs/tags/${{ needs.prepare-release.outputs.tag }}"

    publish-npm:
        needs:
            - prepare-release
            - push-release
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            id-token: write
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
                  ref: ${{ needs.prepare-release.outputs.tag }}

            - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
              with:
                  node-version-file: .nvmrc

            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: release-package
                  path: .

            - name: verify downloaded release artifact
              run: |
                  EXPECTED_VERSION="${{ needs.prepare-release.outputs.version }}"
                  ROOT_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")
                  ACTUAL_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('packages/sdk/package.json', 'utf8')).version)")

                  if [[ "${ROOT_VERSION}" != "${EXPECTED_VERSION}" ]]; then
                    echo "Root package metadata version mismatch: expected ${EXPECTED_VERSION}, received ${ROOT_VERSION}." >&2
                    exit 1
                  fi

                  if [[ "${ACTUAL_VERSION}" != "${EXPECTED_VERSION}" ]]; then
                    echo "Downloaded release package metadata version mismatch: expected ${EXPECTED_VERSION}, received ${ACTUAL_VERSION}." >&2
                    exit 1
                  fi

                  if [[ ! -f packages/sdk/dist/index.js ]]; then
                    echo "Downloaded release artifact is missing packages/sdk/dist/index.js." >&2
                    exit 1
                  fi

            - name: publish to npm
              run: |
                  PUBLIC_PACKAGE_DIR="$(mktemp -d)"
                  node ./tools/ci/stage-public-package.mjs --out "${PUBLIC_PACKAGE_DIR}"
                  cd "${PUBLIC_PACKAGE_DIR}"

                  if [[ "${{ needs.prepare-release.outputs.dist_tag }}" == "latest" ]]; then
                    npm publish --ignore-scripts
                  else
                    npm publish --ignore-scripts --tag "${{ needs.prepare-release.outputs.dist_tag }}"
                  fi

    create-github-release:
        needs:
            - prepare-release
            - push-release
            - publish-npm
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        defaults:
            run:
                shell: bash
        steps:
            - name: create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [[ "${{ needs.prepare-release.outputs.prerelease }}" == "true" ]]; then
                    gh release create "${{ needs.prepare-release.outputs.tag }}" \
                      --repo "${{ github.repository }}" \
                      --verify-tag \
                      --title "${{ needs.prepare-release.outputs.tag }}" \
                      --generate-notes \
                      --prerelease
                  else
                    gh release create "${{ needs.prepare-release.outputs.tag }}" \
                      --repo "${{ github.repository }}" \
                      --verify-tag \
                      --title "${{ needs.prepare-release.outputs.tag }}" \
                      --generate-notes
                  fi
