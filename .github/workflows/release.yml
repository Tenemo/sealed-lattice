name: release

run-name: release ${{ inputs.release_type }} from ${{ github.event.repository.default_branch }}

on:
    workflow_dispatch:
        inputs:
            release_type:
                description: Version bump to apply
                required: true
                type: choice
                default: patch
                options:
                    - patch
                    - minor

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    validate-source:
        name: validate source
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            actions: read
            contents: read
        steps:
            - name: Require the default branch
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
                    echo "Select ${DEFAULT_BRANCH} in the manual-dispatch branch selector." >&2
                    exit 1
                  fi

            - name: Require successful CI for the exact source
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  mapfile -t SUCCESSFUL_CI_RUN_IDS < <(
                    gh run list \
                      --repo "${GITHUB_REPOSITORY}" \
                      --workflow ci.yml \
                      --commit "${GITHUB_SHA}" \
                      --status success \
                      --limit 20 \
                      --json databaseId \
                      --jq '.[].databaseId'
                  )

                  for CI_RUN_ID in "${SUCCESSFUL_CI_RUN_IDS[@]}"; do
                    if [[ "$(gh run view "${CI_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json jobs --jq '[.jobs[] | select(.name == "verify" and .conclusion == "success")] | length')" -gt 0 ]]; then
                      echo "Exact source ${GITHUB_SHA} passed CI in run ${CI_RUN_ID}."
                      exit 0
                    fi
                  done

                  echo "No successful ci / verify job exists for exact source ${GITHUB_SHA}." >&2
                  exit 1

    prepare-release:
        name: prepare release
        needs:
            - validate-source
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        outputs:
            tag: ${{ steps.version.outputs.tag }}
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  ref: ${{ github.sha }}
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  toolchain: 1.90.0
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

            - name: Prepare public package version
              id: version
              env:
                  RELEASE_INCREMENT: ${{ inputs.release_type }}
              run: pnpm run release:version -- "${RELEASE_INCREMENT}"

            - name: Validate release metadata changes
              run: pnpm exec tsx ./tools/ci/release-gates.ts metadata

            - name: Require unused release targets
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
                  RELEASE_VERSION: ${{ steps.version.outputs.version }}
                  SOURCE_SHA: ${{ github.sha }}
              run: pnpm exec tsx ./tools/ci/release-gates.ts targets

            - name: Run release package smoke tests
              timeout-minutes: 40
              run: pnpm run smoke:pack:npm

            - name: Upload release-preparation diagnostics
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  if-no-files-found: warn
                  name: prepare-release-logs-${{ github.run_id }}-${{ github.run_attempt }}
                  path: logs

    push-release:
        name: push release
        needs:
            - prepare-release
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        outputs:
            release_sha: ${{ steps.release-commit.outputs.sha }}
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  ref: ${{ github.sha }}
            - uses: ./.github/actions/bootstrap-pnpm

            - name: Verify unchanged release targets
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                  RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
                  RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
                  SOURCE_SHA: ${{ github.sha }}
              run: pnpm exec tsx ./tools/ci/release-gates.ts targets

            - name: Recreate release metadata
              id: version
              env:
                  RELEASE_INCREMENT: ${{ inputs.release_type }}
              run: pnpm run release:version -- "${RELEASE_INCREMENT}"

            - name: Verify recreated release metadata
              env:
                  EXPECTED_TAG: ${{ needs.prepare-release.outputs.tag }}
                  EXPECTED_VERSION: ${{ needs.prepare-release.outputs.version }}
                  RECREATED_TAG: ${{ steps.version.outputs.tag }}
                  RECREATED_VERSION: ${{ steps.version.outputs.version }}
              run: |
                  if [[ "${RECREATED_VERSION}" != "${EXPECTED_VERSION}" || "${RECREATED_TAG}" != "${EXPECTED_TAG}" ]]; then
                    echo "Recreated release metadata does not match the prepared release." >&2
                    exit 1
                  fi
                  pnpm exec tsx ./tools/ci/release-gates.ts metadata

            - name: Commit and tag release metadata
              id: release-commit
              env:
                  RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add packages/sdk/package.json
                  if git diff --cached --quiet; then
                    echo "No release metadata changes were staged." >&2
                    exit 1
                  fi
                  git commit -m "chore(release): ${RELEASE_TAG}"
                  git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
                  echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

            - name: Push release commit and tag atomically
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
              run: |
                  gh auth setup-git
                  if ! git push --atomic origin "HEAD:${DEFAULT_BRANCH}" "refs/tags/${RELEASE_TAG}"; then
                    echo "The short-lived GITHUB_TOKEN could not advance ${DEFAULT_BRANCH}. Allow the release workflow to bypass the default-branch pull-request rule, then rerun from an unmodified source." >&2
                    exit 1
                  fi

            - name: Upload release-push diagnostics
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  if-no-files-found: warn
                  name: push-release-logs-${{ github.run_id }}-${{ github.run_attempt }}
                  path: logs

    publish-npm:
        name: publish npm
        needs:
            - prepare-release
            - push-release
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
                  ref: ${{ needs.prepare-release.outputs.tag }}
            - uses: ./.github/actions/bootstrap-pnpm

            - name: Verify the checked-out release tag
              env:
                  RELEASE_SHA: ${{ needs.push-release.outputs.release_sha }}
                  RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
              run: pnpm exec tsx ./tools/ci/release-gates.ts checked-out-tag
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  toolchain: 1.90.0
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
            - name: Run and retain tag-built package smoke tests
              id: public-package
              timeout-minutes: 40
              env:
                  RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
              run: pnpm run smoke:pack:npm -- --out "${RUNNER_TEMP}/sealed-lattice-${RELEASE_VERSION}.tgz"

            - name: Determine npm publication
              id: npm-disposition
              env:
                  PACKAGE_INTEGRITY: ${{ steps.public-package.outputs.integrity }}
                  PACKAGE_TARBALL_PATH: ${{ steps.public-package.outputs.tarball }}
                  RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
              run: pnpm exec tsx ./tools/ci/release-gates.ts npm-disposition

            - name: Publish the tag-built package to npm
              if: steps.npm-disposition.outputs.publish == 'true'
              env:
                  PACKAGE_TARBALL_PATH: ${{ steps.public-package.outputs.tarball }}
              run: npm publish "${PACKAGE_TARBALL_PATH}" --access public --ignore-scripts --provenance --tag latest

            - name: Upload publication diagnostics
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  if-no-files-found: warn
                  name: publish-npm-logs-${{ github.run_id }}-${{ github.run_attempt }}
                  path: logs

    create-github-release:
        name: create GitHub release
        needs:
            - prepare-release
            - push-release
            - publish-npm
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
                  ref: ${{ needs.prepare-release.outputs.tag }}
            - uses: ./.github/actions/bootstrap-pnpm

            - name: Verify the checked-out release tag
              env:
                  RELEASE_SHA: ${{ needs.push-release.outputs.release_sha }}
                  RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
              run: pnpm exec tsx ./tools/ci/release-gates.ts checked-out-tag

            - name: Determine GitHub release creation
              id: github-release-disposition
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
              run: pnpm exec tsx ./tools/ci/release-gates.ts github-release-disposition

            - name: Create a normal GitHub release
              if: steps.github-release-disposition.outputs.create == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
              run: |
                  gh release create "${RELEASE_TAG}" \
                    --repo "${GITHUB_REPOSITORY}" \
                    --verify-tag \
                    --title "${RELEASE_TAG}" \
                    --generate-notes

            - name: Upload GitHub-release diagnostics
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  if-no-files-found: warn
                  name: create-github-release-logs-${{ github.run_id }}-${{ github.run_attempt }}
                  path: logs
