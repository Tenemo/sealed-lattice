name: release

run-name: release ${{ inputs.release_type }} from ${{ github.event.repository.default_branch }}

on:
    workflow_dispatch:
        inputs:
            release_type:
                description: Version bump to apply
                required: true
                type: choice
                default: patch
                options:
                    - patch
                    - minor

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    verify:
        name: verify source and package
        runs-on: ubuntu-24.04
        timeout-minutes: 120
        outputs:
            tag: ${{ steps.version.outputs.tag }}
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Require the default branch
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
                    echo "Select ${DEFAULT_BRANCH} in the manual-dispatch branch selector." >&2
                    exit 1
                  fi

            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
                  ref: ${{ github.sha }}
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  toolchain: 1.90.0
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

            - name: Install Chromium
              run: pnpm exec playwright install --with-deps chromium
            - name: Verify release source
              run: pnpm run check:desktop
            - name: Verify reproducible build output
              run: pnpm run build:verify-reproducible

            - name: Prepare public package version
              id: version
              run: pnpm run release:version -- "${{ inputs.release_type }}"

            - name: Require one unused release target
              env:
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
                  RELEASE_VERSION: ${{ steps.version.outputs.version }}
              run: |
                  if [[ "$(git diff --name-only)" != "packages/sdk/package.json" ]]; then
                    echo "Release preparation must change only packages/sdk/package.json." >&2
                    git status --short >&2
                    exit 1
                  fi
                  if [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
                    echo "Release preparation produced untracked files." >&2
                    git ls-files --others --exclude-standard >&2
                    exit 1
                  fi
                  git diff --check
                  git fetch --tags origin
                  if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}"; then
                    echo "Tag ${RELEASE_TAG} already exists." >&2
                    exit 1
                  fi
                  set +e
                  npm view "sealed-lattice@${RELEASE_VERSION}" version >"${RUNNER_TEMP}/npm-version" 2>"${RUNNER_TEMP}/npm-error"
                  npm_status=$?
                  set -e
                  if [[ ${npm_status} -eq 0 ]]; then
                    echo "sealed-lattice@${RELEASE_VERSION} already exists on npm." >&2
                    exit 1
                  fi
                  if ! grep -q "E404" "${RUNNER_TEMP}/npm-error"; then
                    cat "${RUNNER_TEMP}/npm-error" >&2
                    exit ${npm_status}
                  fi

            - name: Smoke the versioned package
              run: pnpm run smoke:pack:npm

            - name: Upload verification diagnostics
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  if-no-files-found: warn
                  name: release-verify-logs-${{ github.run_id }}-${{ github.run_attempt }}
                  path: logs

    push:
        name: push release commit and tag
        needs: verify
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        outputs:
            release_sha: ${{ steps.release.outputs.sha }}
        steps:
            - name: Require the release deploy key
              env:
                  RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
              run: |
                  if [[ -z "${RELEASE_DEPLOY_KEY}" ]]; then
                    echo "Missing RELEASE_DEPLOY_KEY repository secret." >&2
                    exit 1
                  fi

            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  fetch-depth: 0
                  persist-credentials: true
                  ref: ${{ github.sha }}
                  ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

            - name: Apply the verified public version
              env:
                  RELEASE_VERSION: ${{ needs.verify.outputs.version }}
              run: |
                  node --input-type=module <<'NODE'
                  import { readFile, writeFile } from 'node:fs/promises';
                  const manifestPath = 'packages/sdk/package.json';
                  const manifest = JSON.parse(await readFile(manifestPath, 'utf8'));
                  manifest.version = process.env.RELEASE_VERSION;
                  await writeFile(manifestPath, `${JSON.stringify(manifest, null, 4)}\n`);
                  NODE
                  test "$(git diff --name-only)" = "packages/sdk/package.json"
                  git diff --check

            - name: Commit, tag, and atomically push
              id: release
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                  RELEASE_TAG: ${{ needs.verify.outputs.tag }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add packages/sdk/package.json
                  git commit -m "Release ${RELEASE_TAG}"
                  git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
                  git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
                  git push --atomic origin "HEAD:${DEFAULT_BRANCH}" "refs/tags/${RELEASE_TAG}"
                  echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

    package:
        name: build exact tag package
        needs:
            - verify
            - push
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        outputs:
            integrity: ${{ steps.package.outputs.integrity }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false
                  ref: ${{ needs.verify.outputs.tag }}
            - uses: ./.github/actions/bootstrap-pnpm
            - uses: dtolnay/rust-toolchain@b18f7037bce1ea84c086f4d5e9493f853c0ce412
              with:
                  toolchain: 1.90.0
                  targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

            - name: Verify checked-out release commit
              env:
                  RELEASE_SHA: ${{ needs.push.outputs.release_sha }}
                  RELEASE_TAG: ${{ needs.verify.outputs.tag }}
              run: |
                  test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
                  test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${RELEASE_SHA}"

            - name: Build and retain the published tarball
              id: package
              env:
                  RELEASE_VERSION: ${{ needs.verify.outputs.version }}
              run: pnpm run smoke:pack:npm -- --out "${RUNNER_TEMP}/sealed-lattice-${RELEASE_VERSION}.tgz"

            - name: Upload exact package
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  if-no-files-found: error
                  name: release-package-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ steps.package.outputs.tarball }}
                  retention-days: 7

            - name: Upload package diagnostics
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  if-no-files-found: warn
                  name: release-package-logs-${{ github.run_id }}-${{ github.run_attempt }}
                  path: logs

    publish-npm:
        name: publish npm package
        needs:
            - verify
            - package
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            actions: read
            contents: read
            id-token: write
        steps:
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: release-package-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/release-package

            - name: Verify retained package integrity
              env:
                  EXPECTED_INTEGRITY: ${{ needs.package.outputs.integrity }}
                  PACKAGE_TARBALL_PATH: ${{ runner.temp }}/release-package/sealed-lattice-${{ needs.verify.outputs.version }}.tgz
              run: |
                  actual_integrity=$(node --input-type=module -e "import { createHash } from 'node:crypto'; import { readFileSync } from 'node:fs'; process.stdout.write('sha512-' + createHash('sha512').update(readFileSync(process.env.PACKAGE_TARBALL_PATH)).digest('base64')); ")
                  test "${actual_integrity}" = "${EXPECTED_INTEGRITY}"

            - name: Determine npm publication
              id: npm
              env:
                  LOCAL_INTEGRITY: ${{ needs.package.outputs.integrity }}
                  RELEASE_VERSION: ${{ needs.verify.outputs.version }}
              run: |
                  set +e
                  remote_integrity=$(npm view "sealed-lattice@${RELEASE_VERSION}" dist.integrity 2>"${RUNNER_TEMP}/npm-error")
                  npm_status=$?
                  set -e
                  if [[ ${npm_status} -eq 0 ]]; then
                    if [[ "${remote_integrity}" != "${LOCAL_INTEGRITY}" ]]; then
                      echo "npm contains different bytes for sealed-lattice@${RELEASE_VERSION}." >&2
                      exit 1
                    fi
                    echo "publish=false" >> "${GITHUB_OUTPUT}"
                  elif grep -q "E404" "${RUNNER_TEMP}/npm-error"; then
                    echo "publish=true" >> "${GITHUB_OUTPUT}"
                  else
                    cat "${RUNNER_TEMP}/npm-error" >&2
                    exit ${npm_status}
                  fi

            - name: Publish to npm with provenance
              if: steps.npm.outputs.publish == 'true'
              env:
                  PACKAGE_TARBALL_PATH: ${{ runner.temp }}/release-package/sealed-lattice-${{ needs.verify.outputs.version }}.tgz
              run: npm publish "${PACKAGE_TARBALL_PATH}" --access public --ignore-scripts --provenance --tag latest

    create-release:
        name: create GitHub release
        needs:
            - verify
            - push
            - publish-npm
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - name: Create GitHub release if absent
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ needs.verify.outputs.tag }}
              run: |
                  if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
                    gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${RELEASE_TAG}" --generate-notes
                  fi
