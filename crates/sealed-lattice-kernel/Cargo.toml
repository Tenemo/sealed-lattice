[package]
name = "sealed-lattice-kernel"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
proof-backend-bakeoff = [
    "dep:p3-challenger",
    "dep:p3-commit",
    "dep:p3-dft",
    "dep:p3-field",
    "dep:p3-goldilocks",
    "dep:p3-merkle-tree",
    "dep:p3-multilinear-util",
    "dep:p3-sumcheck",
    "dep:p3-symmetric",
    "dep:p3-whir",
    "dep:postcard",
    "dep:rand",
]

[dependencies]
aes = { version = "=0.8.4", default-features = false, features = ["zeroize"] }
aes-gcm-siv = { version = "=0.11.1", default-features = false, features = ["aes", "alloc"] }
ctr = { version = "=0.9.2", default-features = false, features = ["zeroize"] }
fips203 = { version = "=0.4.3", default-features = false, features = ["ml-kem-768"] }
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-65"] }
ghash = { version = "=0.5.1", default-features = false, features = ["zeroize"] }
num-bigint = "0.4"
num-traits = "0.2"
p3-challenger = { path = "../../reference-projects/plonky3/challenger", default-features = false, optional = true }
p3-commit = { path = "../../reference-projects/plonky3/commit", default-features = false, optional = true }
p3-dft = { path = "../../reference-projects/plonky3/dft", default-features = false, optional = true }
p3-field = { path = "../../reference-projects/plonky3/field", default-features = false, optional = true }
p3-goldilocks = { path = "../../reference-projects/plonky3/goldilocks", default-features = false, optional = true }
p3-merkle-tree = { path = "../../reference-projects/plonky3/merkle-tree", default-features = false, optional = true }
p3-multilinear-util = { path = "../../reference-projects/plonky3/multilinear-util", default-features = false, optional = true }
p3-sumcheck = { path = "../../reference-projects/plonky3/sumcheck", default-features = false, optional = true }
p3-symmetric = { path = "../../reference-projects/plonky3/symmetric", default-features = false, optional = true }
p3-whir = { path = "../../reference-projects/plonky3/whir", default-features = false, optional = true }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"], optional = true }
rand = { version = "=0.10.1", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "=0.10.9"
subtle = { version = "=2.6.1", default-features = false }
tiny-keccak = { version = "=2.0.2", features = ["kmac", "shake"] }
unicode-normalization = "=0.1.25"
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"
