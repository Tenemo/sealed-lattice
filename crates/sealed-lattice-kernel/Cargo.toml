[package]
name = "sealed-lattice-kernel"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fips203 = { version = "=0.4.3", default-features = false, features = ["ml-kem-768"] }
sha3 = { version = "=0.10.9", features = ["zeroize"] }
unicode-normalization = "=0.1.25"
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }

[dev-dependencies]
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-65"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
