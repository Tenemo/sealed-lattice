[package]
name = "sealed-lattice-kernel"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# These direct feature-unifying pins make AES-GCM wipe its AES and GHASH state on drop.
aes = { version = "=0.8.4", default-features = false, features = ["zeroize"] }
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
aes-gcm-siv = { version = "=0.11.1", default-features = false, features = ["aes"] }
fips203 = { version = "=0.4.3", default-features = false, features = ["ml-kem-768"] }
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-65"] }
ghash = { version = "=0.5.1", default-features = false, features = ["zeroize"] }
hkdf = { version = "=0.12.4", default-features = false }
num-bigint = "0.4"
num-traits = "0.2"
polyval = { version = "=0.6.2", default-features = false, features = ["zeroize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "=0.10.9"
sha2 = { version = "=0.10.9", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
tiny-keccak = { version = "=2.0.2", default-features = false, features = ["kmac"] }
unicode-normalization = "=0.1.25"
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"
