[package]
name = "sealed-lattice-kernel"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm-siv = { version = "=0.11.1", default-features = false, features = ["aes", "alloc"] }
fips203 = { version = "=0.4.3", default-features = false, features = ["ml-kem-768"] }
sealed-lattice-sphincs-plus = { path = "../sealed-lattice-sphincs-plus" }
sha3 = "=0.10.9"
subtle = { version = "=2.6.1", default-features = false }
unicode-normalization = "=0.1.25"
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }
