[package]
name = "setup-witness"
version.workspace = true
edition.workspace = true
publish.workspace = true
autobins = false

[lib]
crate-type = ["rlib"]

[dependencies]
aes-gcm = { workspace = true, features = ["aes", "alloc", "zeroize"], optional = true }
aes = { workspace = true, features = ["zeroize"], optional = true }
num-bigint.workspace = true
num-traits.workspace = true
sha3.workspace = true
zeroize.workspace = true
linked-release-proof = { path = "../linked-release-proof" }
parallel-work = { path = "../parallel-work" }
setup-stream-kernel = { path = "../setup-stream-kernel" }
supported-profile = { path = "../supported-profile" }

[features]
custody = ["dep:aes-gcm", "dep:aes"]
key-source-screen = []

[[bin]]
name = "screen-fhe-key-source"
path = "src/bin/screen-fhe-key-source.rs"
required-features = ["key-source-screen"]
