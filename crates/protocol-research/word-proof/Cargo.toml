[package]
name = "word-proof"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false


[dependencies]
sha3 = { version = "=0.10.9", features = ["zeroize"] }
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc", "zeroize"] }
aes = { version = "=0.8.4", features = ["zeroize"] }
zeroize = "=1.8.2"
parallel-work = { path = "../parallel-work" }
setup-stream-kernel = { path = "../setup-stream-kernel" }
supported-profile = { path = "../supported-profile" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "=0.3.3"

[features]
# Test aids for the crates that prove with this engine: a replayed seed in
# place of the host's randomness, and every row of an affine operator.
test-support = []

[lib]
crate-type = ["rlib"]
