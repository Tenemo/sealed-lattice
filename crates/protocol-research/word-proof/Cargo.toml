[package]
name = "word-proof"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sha3 = { workspace = true, features = ["zeroize"] }
zeroize.workspace = true
parallel-work = { path = "../parallel-work" }
setup-stream-kernel = { path = "../setup-stream-kernel" }
supported-profile = { path = "../supported-profile" }

[features]
# Test aids for the crates that prove with this engine: a replayed seed in
# place of the host's randomness, and every row of an affine operator.
test-support = []

[lib]
crate-type = ["rlib"]
