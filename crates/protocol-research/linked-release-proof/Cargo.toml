[package]
name = "linked-release-proof"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false


[lib]
crate-type = ["rlib"]

[dependencies]
proof-lookup-table = { path = "../proof-lookup-table" }
num-bigint = "=0.5.1"
num-traits = "=0.2.19"
sha3 = "=0.10.9"
zeroize = "=1.8.2"
parallel-work = { path = "../parallel-work" }
setup-stream-kernel = { path = "../setup-stream-kernel" }
supported-profile = { path = "../supported-profile" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "=0.3.3"
