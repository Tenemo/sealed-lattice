[package]
name = "linked-release-proof"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false


[lib]
crate-type = ["rlib"]

[dependencies]
num-bigint = "=0.5.1"
num-traits = "=0.2.19"
zeroize = "=1.8.2"
parallel-work = { path = "../parallel-work" }
setup-stream-kernel = { path = "../setup-stream-kernel" }
supported-profile = { path = "../supported-profile" }
word-proof = { path = "../word-proof" }
word-verifier = { path = "../word-verifier" }

[dev-dependencies]
# The witness tests compile the setup witness's common polynomial.
sha3 = "=0.10.9"
word-proof = { path = "../word-proof", features = ["test-support"] }
