[package]
name = "linked-release-proof"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
num-bigint.workspace = true
num-traits.workspace = true
zeroize.workspace = true
parallel-work = { path = "../parallel-work" }
statement-stream = { path = "../statement-stream" }
supported-profile = { path = "../supported-profile" }
word-proof = { path = "../word-proof" }
word-verifier = { path = "../word-verifier" }

[dev-dependencies]
# The tests take the common share polynomial, the error sampler and the
# registration key from the setup witness, and replay seeded streams.
setup-witness = { path = "../setup-witness" }
sha3.workspace = true
word-proof = { path = "../word-proof", features = ["test-support"] }
