[workspace]
members = [
    "native-ceremony",
    "purpose-signature",
    "encrypted-source-operator",
    "participant-module",
    "protocol-foundations",
    "setup-witness",
    "word-proof",
    "word-verifier",
    "statement-stream",
    "setup-aggregate",
    "ballot-encryption",
    "ballot-proof",
    "evaluation-target",
    "linked-release-proof",
    "encrypted-ranking",
    "supported-profile",
    "parallel-work",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
aes = "=0.9.3"
aes-gcm = { version = "=0.11.1", default-features = false }
getrandom = "=0.4.3"
num-bigint = "=0.5.1"
num-traits = "=0.2.19"
sha3 = "=0.10.9"
zeroize = "=1.9.1"


[profile.test]
opt-level = 3
overflow-checks = true

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
overflow-checks = true
