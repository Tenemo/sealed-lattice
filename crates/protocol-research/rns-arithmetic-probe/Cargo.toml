[package]
name = "rns-arithmetic-probe"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false


[lib]
crate-type = ["rlib"]


[features]
numerical-probes = []

[dependencies]
fhe-math = { path = "../vendor/fhe-rs/crates/fhe-math", default-features = false, features = ["scalar-only"] }
num-bigint = "=0.5.1"
num-traits = "=0.2.19"
registration-credentials = { path = "../registration-credentials", default-features = false }
supported-profile = { path = "../supported-profile" }

[[bin]]
name = "check-requested-output"
path = "src/bin/check-requested-output.rs"
required-features = ["numerical-probes"]
