[package]
name = "arithmetic-width-benchmark"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false

# Its own workspace, so that the benchmark leaves the research workspace's
# manifest and lockfile, which the participant module's identity covers,
# unchanged.
[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "arithmetic-width-benchmark"
path = "src/main.rs"

[dependencies]
fhe-math = { path = "../vendor/fhe-rs/crates/fhe-math", default-features = false, features = ["scalar-only"] }
num-bigint = "=0.5.1"
supported-profile = { path = "../supported-profile" }

[profile.test]
opt-level = 3
overflow-checks = true

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
overflow-checks = true
