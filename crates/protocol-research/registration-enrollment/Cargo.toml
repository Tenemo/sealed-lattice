[package]
name = "registration-enrollment"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false


[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
registration-credentials = { path = "../registration-credentials", default-features = false }
registration-proof = { path = "../registration-proof", default-features = false }
contribution-prover = { path = "../contribution-prover", default-features = false }
setup-witness = { path = "../setup-witness", features = ["custody"] }
num-bigint = "=0.5.1"
sha3 = "=0.10.9"
zeroize = "=1.8.2"
ballot-proof = { path = "../ballot-proof", default-features = false }
ballot-encryption = { path = "../ballot-encryption", default-features = false }
setup-aggregate = { path = "../setup-aggregate", default-features = false, features = ["bridge"] }
evaluation-target = { path = "../evaluation-target" }
linked-release-proof = { path = "../linked-release-proof", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "=0.3.3"
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-65"] }
