[package]
name = "registration-enrollment"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false


[lib]
crate-type = ["rlib", "cdylib"]

[features]
# A corrupt participant's runtime, which signs authentic invalid ballots.
invalid-ballot = ["ballot-proof/invalid-ballot"]

[dependencies]
registration-credentials = { path = "../registration-credentials" }
registration-proof = { path = "../registration-proof" }
contribution-prover = { path = "../contribution-prover" }
setup-witness = { path = "../setup-witness", features = ["custody"] }
supported-profile = { path = "../supported-profile" }
num-bigint = "=0.5.1"
# The contribution randomness streams hold secret sponge states.
sha3 = { version = "=0.10.9", features = ["zeroize"] }
zeroize = "=1.8.2"
ballot-proof = { path = "../ballot-proof" }
ballot-encryption = { path = "../ballot-encryption" }
setup-aggregate = { path = "../setup-aggregate" }
evaluation-target = { path = "../evaluation-target" }
linked-release-proof = { path = "../linked-release-proof" }
parallel-work = { path = "../parallel-work" }
word-proof = { path = "../word-proof" }
rns-arithmetic-probe = { path = "../rns-arithmetic-probe" }
setup-stream-kernel = { path = "../setup-stream-kernel" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "=0.3.3"
