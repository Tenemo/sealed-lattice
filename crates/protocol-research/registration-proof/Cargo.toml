[package]
name = "registration-proof"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false


[lib]
crate-type = ["rlib"]

[dependencies]
setup-witness = { path = "../setup-witness" }
setup-stream-kernel = { path = "../setup-stream-kernel" }
supported-profile = { path = "../supported-profile" }
sha3 = "=0.10.9"
num-bigint = "=0.5.1"
zeroize = "=1.8.2"
parallel-work = { path = "../parallel-work" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "=0.3.3"
