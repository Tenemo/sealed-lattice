[package]
name = "seed-sharing-proof"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
num-bigint = "=0.5.1"
parallel-work = { path = "../parallel-work" }
supported-profile = { path = "../supported-profile" }
word-proof = { path = "../word-proof" }
word-verifier = { path = "../word-verifier" }
setup-stream-kernel = { path = "../setup-stream-kernel" }
zeroize = "=1.8.2"

[dev-dependencies]
word-proof = { path = "../word-proof", features = ["test-support"] }

[features]
native-fixture = ["word-proof/test-support"]
scalar-fixture = []
scalar-prover-fixture = ["scalar-fixture", "word-proof/test-support"]

[[bin]]
name = "check-seed-sharing-proof"
path = "src/bin/check-seed-sharing-proof.rs"
required-features = ["native-fixture"]

