[package]
name = "parallel-work"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false

[dependencies]
digest = { version = "=0.11.3", default-features = false, features = ["zeroize"] }
keccak = "=0.2.2"
sha3 = "=0.10.9"
sponge-cursor = { version = "=0.1.0", features = ["zeroize"] }
zeroize = "=1.8.2"

[lib]
crate-type = ["rlib"]
