# fips204 0.4.6 from crates.io (archive SHA-256
# c9fb5a367b9846933e271a3c2a992930743f82ae5e8cb7faa780715a80fa0b15, upstream
# commit 8d456d989dce681233ef963d3c3306da8f76d7c7), vendored with one change:
# src/ntt.rs reduces each inverse-transform input coefficient below q in
# magnitude, and the test-support feature exposes that transform to the
# workspace's regression test. The benchmark and test targets, their
# dependencies and the profiles, which a dependency does not use, are omitted.

[package]
edition = "2021"
rust-version = "1.70"
name = "fips204"
version = "0.4.6"
authors = ["Eric Schorn <eschorn@integritychain.com>"]
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "FIPS 204: Module-Lattice-Based Digital Signature"
documentation = "https://docs.rs/fips204"
readme = "README.md"
keywords = [
    "FIPS204",
    "lattice",
    "dilithium",
    "signature",
]
categories = [
    "cryptography",
    "no-std",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/integritychain/fips204"

[lib]
name = "fips204"
path = "src/lib.rs"

[dependencies.rand_core]
version = "0.6.4"
default-features = false

[dependencies.sha2]
version = "0.10.8"
default-features = false

[dependencies.sha3]
version = "0.10.2"
default-features = false

[dependencies.zeroize]
version = "1.6.0"
features = ["zeroize_derive"]
default-features = false

[features]
default = [
    "default-rng",
    "ml-dsa-44",
    "ml-dsa-65",
    "ml-dsa-87",
]
default-rng = ["rand_core/getrandom"]
dudect = []
ml-dsa-44 = []
ml-dsa-65 = []
ml-dsa-87 = []
test-support = []
