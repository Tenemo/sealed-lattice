[package]
name = "ballot-proof"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib"]

[features]
# A corrupt participant's runtime: ballot creation proves a false statement.
invalid-ballot = []

[dependencies]
ballot-encryption = { path = "../ballot-encryption" }
setup-aggregate = { path = "../setup-aggregate" }
registration-credentials = { path = "../registration-credentials" }
setup-stream-kernel = { path = "../setup-stream-kernel" }
num-bigint = "=0.5.1"
setup-witness = { path = "../setup-witness" }
zeroize = "=1.8.2"
parallel-work = { path = "../parallel-work" }
supported-profile = { path = "../supported-profile" }
word-proof = { path = "../word-proof" }
word-verifier = { path = "../word-verifier" }

[dev-dependencies]
word-proof = { path = "../word-proof", features = ["test-support"] }
