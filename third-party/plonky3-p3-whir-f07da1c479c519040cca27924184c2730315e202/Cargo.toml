# Local modification notice: this manifest expands the exact upstream
# workspace-inherited metadata and dependencies for use as an isolated local
# Cargo patch. See UPSTREAM.md for the source revision and patch scope.

[package]
name = "p3-whir"
description = "WHIR polynomial commitment scheme"
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Plonky3/Plonky3"
homepage = "https://github.com/Plonky3/Plonky3"
keywords = ["cryptography", "SNARK", "PLONK", "FRI", "plonky3"]
categories = ["cryptography::cryptocurrencies"]

[features]
default = []
parallel = ["p3-maybe-rayon/parallel"]
zk = ["dep:p3-zk-codes", "dep:rand", "p3-sumcheck/zk"]

[dependencies]
p3-challenger = { git = "https://github.com/Plonky3/Plonky3.git", rev = "f07da1c479c519040cca27924184c2730315e202", default-features = false }
p3-commit = { git = "https://github.com/Plonky3/Plonky3.git", rev = "f07da1c479c519040cca27924184c2730315e202", default-features = false }
p3-dft = { git = "https://github.com/Plonky3/Plonky3.git", rev = "f07da1c479c519040cca27924184c2730315e202", default-features = false }
p3-field = { git = "https://github.com/Plonky3/Plonky3.git", rev = "f07da1c479c519040cca27924184c2730315e202", default-features = false }
p3-matrix = { git = "https://github.com/Plonky3/Plonky3.git", rev = "f07da1c479c519040cca27924184c2730315e202", default-features = false }
p3-maybe-rayon = { git = "https://github.com/Plonky3/Plonky3.git", rev = "f07da1c479c519040cca27924184c2730315e202", default-features = false }
p3-merkle-tree = { git = "https://github.com/Plonky3/Plonky3.git", rev = "f07da1c479c519040cca27924184c2730315e202", default-features = false }
p3-multilinear-util = { git = "https://github.com/Plonky3/Plonky3.git", rev = "f07da1c479c519040cca27924184c2730315e202", default-features = false }
p3-sumcheck = { git = "https://github.com/Plonky3/Plonky3.git", rev = "f07da1c479c519040cca27924184c2730315e202", default-features = false }
p3-symmetric = { git = "https://github.com/Plonky3/Plonky3.git", rev = "f07da1c479c519040cca27924184c2730315e202", default-features = false }
p3-util = { git = "https://github.com/Plonky3/Plonky3.git", rev = "f07da1c479c519040cca27924184c2730315e202", default-features = false }
p3-zk-codes = { git = "https://github.com/Plonky3/Plonky3.git", rev = "f07da1c479c519040cca27924184c2730315e202", default-features = false, optional = true }
hashbrown = "0.17.1"
itertools = { version = "0.14.0", default-features = false, features = ["use_alloc"] }
libm = "0.2"
rand = { version = "0.10.1", default-features = false, optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
spin = "0.12.0"
thiserror = { version = "2.0", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["attributes"] }
