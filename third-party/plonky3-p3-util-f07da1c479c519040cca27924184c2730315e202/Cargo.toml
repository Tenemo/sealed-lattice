# Local modification notice: this manifest expands the exact upstream
# workspace-inherited metadata and dependencies for use as an isolated local
# Cargo patch. See UPSTREAM.md for the source revision and verification scope.

[package]
name = "p3-util"
description = "A collection of utility functions and tools for low-level operations, such as bit manipulation and array transformations."
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Plonky3/Plonky3"
homepage = "https://github.com/Plonky3/Plonky3"
keywords = ["cryptography", "SNARK", "PLONK", "FRI", "plonky3"]
categories = ["cryptography::cryptocurrencies"]

[features]
parallel = ["p3-maybe-rayon/parallel"]

[dependencies]
p3-maybe-rayon = { git = "https://github.com/Plonky3/Plonky3.git", rev = "f07da1c479c519040cca27924184c2730315e202", default-features = false }
serde = { version = "1.0", default-features = false }

[dev-dependencies]
p3-baby-bear = { git = "https://github.com/Plonky3/Plonky3.git", rev = "f07da1c479c519040cca27924184c2730315e202", default-features = false }
p3-field = { git = "https://github.com/Plonky3/Plonky3.git", rev = "f07da1c479c519040cca27924184c2730315e202", default-features = false }
p3-goldilocks = { git = "https://github.com/Plonky3/Plonky3.git", rev = "f07da1c479c519040cca27924184c2730315e202", default-features = false }

criterion = "0.8"
proptest = { version = "1.11", default-features = false, features = ["std"] }
rand = { version = "0.10.1", default-features = false }
serde_json = "1.0"

[[bench]]
name = "bit_reverse"
harness = false

[[bench]]
name = "transpose"
harness = false

[patch."https://github.com/Plonky3/Plonky3.git"]
p3-util = { path = "." }
